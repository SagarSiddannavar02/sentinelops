
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelops
  labels:
    app: sentinelops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinelops
  template:
    metadata:
      labels:
        app: sentinelops
    spec:
      containers:
        - name: sentinelops
          image: sentinelops-app:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

